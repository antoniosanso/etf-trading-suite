name: Trading suite from validated datalake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unified.yml"
      - "etf-trading-engine/**"
      - "etf-trading-config/**"
  schedule:
    - cron: "15 17 * * 1-5"

permissions:
  contents: read

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trading suite
        uses: actions/checkout@v4

      - name: Checkout datalake
        uses: actions/checkout@v4
        with:
          repository: antoniosanso/etf-datalake
          path: _datalake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etf-trading-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etf-trading-engine/requirements.txt pytest

      - name: Enforce datalake quality gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("_datalake/latest/quality-report.json")
          if not report_path.exists():
              raise SystemExit("Missing datalake quality report")
          report = json.loads(report_path.read_text())
          if report.get("status") != "pass" or report.get("valid_count", 0) < 96:
              raise SystemExit(f"Datalake is not operational: {report}")
          print(f"Using {report['valid_count']} validated ETFs")
          PY

      - name: Merge historical data
        run: |
          python etf-trading-engine/scripts/merge_eod_robust.py \
            --datalake _datalake \
            --output etf-trading-engine/data/eod.csv

      - name: Test and backtest
        env:
          PYTHONPATH: ${{ github.workspace }}/etf-trading-engine
        run: |
          pytest -q etf-trading-engine/tests
          mkdir -p outputs
          python etf-trading-engine/scripts/run_ci_backtest.py \
            --config etf-trading-config/model.yaml \
            --data etf-trading-engine/data/eod.csv \
            --outdir outputs

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: trading-suite-results
          path: outputs/
          retention-days: 30
